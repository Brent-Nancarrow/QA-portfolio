[pytest]
addopts = --tracing retain-on-failure --video retain-on-failure --screenshot only-on-failure -v
testpaths = tests
markers =
    smoke: critical smoke tests
    ui: UI tests
    api: API tests
    responsive: responsive and viewport-based UI checks
    data: SQL, data validation and dashboard-style checks
    bdd: BDD / Gherkin documentation and mapping checks
