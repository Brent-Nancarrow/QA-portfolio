name: Playwright Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run pytest
        run: |
          pytest -q --alluredir=allure-results --tracing retain-on-failure --video retain-on-failure --screenshot only-on-failure

      - name: Add Allure metadata
        if: always()
        run: |
          cat > allure-results/environment.properties <<'EOT'
          Project=QA-portfolio
          CI=GitHub Actions
          Python=3.13
          Playwright=1.58.0
          pytest=9.0.2
          pytest-playwright=0.7.2
          allure-pytest=2.15.3
          UI target=Sauce Demo
          API target=JSONPlaceholder
          Data validation=SQLite-backed reporting checks
          EOT
          cat > allure-results/executor.json <<'EOT'
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "QA-portfolio Playwright Python Tests",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "QA-portfolio Allure Results"
          }
          EOT
          cat > allure-results/categories.json <<'EOT'
          [
            {
              "name": "UI failures",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*(TimeoutError|locator|expect\\(|AssertionError).*",
              "traceRegex": ".*tests/ui/.*"
            },
            {
              "name": "API failures",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*(AssertionError|status code|response).*",
              "traceRegex": ".*tests/api/.*"
            },
            {
              "name": "Data and reporting failures",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*(AssertionError|SQL|query|dashboard|export).*",
              "traceRegex": ".*tests/data/.*"
            }
          ]
          EOT

      - name: Upload test results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
