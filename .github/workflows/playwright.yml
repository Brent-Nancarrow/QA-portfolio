name: Playwright Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run pytest
        run: |
          pytest -q --alluredir=allure-results --tracing retain-on-failure --video retain-on-failure --screenshot only-on-failure

      - name: Add Allure metadata
        if: always()
        run: |
          cat > allure-results/environment.properties <<'EOT'
          Project=QA-portfolio
          CI=GitHub Actions
          Python=3.13
          Playwright=1.58.0
          pytest=9.0.2
          pytest-playwright=0.7.2
          allure-pytest=2.15.3
          UI target=Sauce Demo
          API target=JSONPlaceholder
          Data validation=SQLite-backed reporting checks
          EOT
          cat > allure-results/executor.json <<'EOT'
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "QA-portfolio Playwright Python Tests",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "QA-portfolio Allure Results"
          }
          EOT
          cat > allure-results/categories.json <<'EOT'
          [
            {
              "name": "UI failures",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*(TimeoutError|locator|expect\(|AssertionError).*,?",
              "traceRegex": ".*tests/ui/.*"
            },
            {
              "name": "API failures",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*(AssertionError|status code|response).*,?",
              "traceRegex": ".*tests/api/.*"
            },
            {
              "name": "Data and reporting failures",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*(AssertionError|SQL|query|dashboard|export).*,?",
              "traceRegex": ".*tests/data/.*"
            }
          ]
          EOT

      - name: Upload test results artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore

  publish-allure-report:
    if: always() && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Allure results artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Set up Java for Allure CLI
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure command line
        run: |
          curl -L -o allure.tgz https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -xzf allure.tgz
          sudo mv allure-2.34.1 /opt/allure
          echo "/opt/allure/bin" >> "$GITHUB_PATH"

      - name: Generate Allure HTML report
        run: |
          allure generate allure-results --clean -o allure-report
          touch allure-report/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
